# Render Blueprint voor de Poker Analytics Challenge API.
# Deploy: op render.com -> New -> Blueprint -> wijs naar deze repo -> Sync.
#
# LET OP — kost geld, jouw keuze:
# de database hieronder staat op "free". Render's gratis Postgres-plan
# VERLOOPT NA 30 DAGEN en wordt dan permanent verwijderd, inclusief alle
# data — dat is korter dan dit hele blok (6+ weken). Voor de testfase is
# free prima, maar zet 'm in de Render-dashboard om naar een betaald plan
# (Basic-256mb, vanaf ~$6/maand, geen verloopdatum) ruim vóór dag 30, of
# meteen als je zeker weet dat dit de rest van het blok blijft draaien.
databases:
  - name: poker-analytics-db
    plan: free
    databaseName: poker_analytics
    user: poker_analytics

services:
  - type: web
    name: poker-analytics-api
    env: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: poker-analytics-db
          property: connectionString

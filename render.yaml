# Render Blueprint voor de Poker Analytics Challenge API.
# Deploy: op render.com -> New -> Blueprint -> wijs naar deze repo -> Sync.
#
# LET OP — kost geld, jouw keuze:
# de database hieronder staat op "free". Render's gratis Postgres-plan
# VERLOOPT NA 30 DAGEN en wordt dan permanent verwijderd, inclusief alle
# data — dat is korter dan dit hele blok (6+ weken). Voor de testfase is
# free prima, maar zet 'm in de Render-dashboard om naar een betaald plan
# (Basic-256mb, vanaf ~$6/maand, geen verloopdatum) ruim vóór dag 30, of
# meteen als je zeker weet dat dit de rest van het blok blijft draaien.
databases:
  - name: poker-analytics-db
    plan: free
    databaseName: poker_analytics
    user: poker_analytics

services:
  - type: web
    name: poker-analytics-api
    env: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: poker-analytics-db
          property: connectionString
      # POKER_COHORT scheidt twee lichtingen die dezelfde database delen.
      #
      # Alle opslag is alleen op WEEK gesleuteld, dus zonder dit landt week 3
      # van een nieuwe lichting bovenop week 3 van de vorige -- inzendingen,
      # galerij, reviews en de toernooi-uitslag. Met een cohort krijgt elke
      # sleutel een voorvoegsel en zien de twee elkaar niet.
      #
      # NIET gezet = de eerste lichting (2026-2027 semester 1). Die heeft geen
      # voorvoegsel, zodat haar data niet hoefde te verhuizen. Laat dat zo.
      #
      # Een tweede lichting erbij: maak in het Render-dashboard een tweede web
      # service vanuit dezelfde repo, wijs hem naar DEZELFDE database, en zet
      # daar POKER_COHORT op bijvoorbeeld 2027-sem2. Eén database, twee
      # services, gescheiden data. Zet er ook een eigen POKER_TOKENS_JSON bij,
      # want die overschrijft bij elke opstart de opgeslagen tokens.
      #
      # Welk cohort een deployment bedient zie je aan GET /versie.
